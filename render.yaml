services:
  - type: web
    name: bvu-rates-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_HEAD_PASSWORD
        generateValue: true
      - key: SEED_DIRECTOR_PASSWORD
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: bvu-rates-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: bvu-rates-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bvu-rates-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
